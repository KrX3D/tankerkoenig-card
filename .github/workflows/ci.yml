name: CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tankerkoenig-card.js syntax
        run: node --check tankerkoenig-card.js

      - name: Validate hacs.json
        run: node -e "JSON.parse(require('fs').readFileSync('hacs.json', 'utf8'))"
